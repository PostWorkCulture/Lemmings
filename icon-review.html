<!doctype html><html><head><meta charset="utf-8"><title>Character likeness review</title><style>body{background:#18241e;color:#eee;font:16px sans-serif;padding:25px}main{display:flex;gap:30px}img{width:400px;height:400px}.icons{display:grid;grid-template-columns:repeat(2,232px);gap:12px}canvas{background:#29382c;border-radius:8px}.actual canvas{width:51px;height:39px;margin:12px}h2{font-size:16px}</style></head><body><main><section><h2>Supplied reference</h2><img src="assets/lemming-reference.jpg"></section><section><h2>Updated icons · enlarged for review</h2><div class="icons"></div><h2>Actual toolbar size</h2><div class="actual"></div></section></main><script type="module">import{loadIconArt,skillIcon}from './src/art.js';await loadIconArt();for(const pose of ['walk','block','build','dig'])for(const sel of ['.icons','.actual']){const c=document.createElement('canvas');c.width=232;c.height=176;c.setAttribute('aria-label',pose);document.querySelector(sel).append(c);skillIcon(c.getContext('2d'),232,176,pose);}</script></body></html>
