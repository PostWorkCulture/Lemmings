<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sweet shop · playable medium levels</title><style>*{box-sizing:border-box}body{margin:0;background:#251e32;color:#f7ebdf;font:14px system-ui}header,nav,footer{padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:23px;margin:6px 0}a{color:#f0d481}small{color:#baa9c6}button,select{background:#4e3b61;border:1px solid #ab8dbd;color:#fff5e8;padding:10px;border-radius:6px;cursor:pointer}button.active{background:#ecd875;color:#322039}nav{background:#31263e}canvas{display:block;width:100%;height:auto}#stage{max-height:76vh;overflow:auto}#status{margin-left:auto}footer{color:#c7b8ce}#skills{display:flex;gap:6px;flex-wrap:wrap}</style><header><div><small>BONUS SWEET ADVENTURES · MEDIUM</small><h1>The Pick ’n’ Mix Crossing</h1></div><a href="sweet-range-review.html">Full sweet range →</a></header><nav><select id="levels" aria-label="Sweet medium level"></select><button id="play">Play level</button><button id="restart">Restart</button><button id="tip">Tip</button><span id="skills"></span><span id="status">20 lemmings · rescue 18</span></nav><div id="stage"><canvas width="1000" height="540" aria-label="Sweet terrain concept"></canvas></div><footer><span id="hint" hidden></span><span>Choose a skill, then click a lemming. Pause to plan or assign skills.</span></footer><script type="module">
import {LEVELS} from './src/levels.js';import {Game} from './src/engine.js';import {SKILLS} from './src/skills.js';import {sweetsLevel,candyArtwork,candyTerrain} from './src/sweets-concept.js';import {prepareSweetPuzzle,SWEET_PUZZLES} from './src/sweet-puzzles.js';import {character,magicalEntrance,exitArch,exitPortal,enteringLemming} from './src/art.js';import {drawObjects,skillEquipment} from './src/object-art.js';import {drawSplats,ImpactAudio} from './src/impact-effects.js';
const params=new URLSearchParams(location.search),puzzle=params.get('puzzle'),necklace=params.has('necklace'),canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),art=document.createElement('canvas'),terrain=document.createElement('canvas');for(const a of [art,terrain]){a.width=1000;a.height=540;}
let index=puzzle===null?-1:Math.max(0,Math.min(4,Number(puzzle)||0));candyArtwork(art.getContext('2d'),null,necklace);LEVELS[20]=index<0?sweetsLevel(necklace):prepareSweetPuzzle(index,art);canvas.height=LEVELS[20].height;terrain.height=LEVELS[20].height;document.querySelector('h1').textContent=LEVELS[20].name;document.querySelector('#hint').textContent=LEVELS[20].hints.join(' ');
const menu=document.querySelector('#levels');menu.add(new Option('Original concept',-1,index<0,index<0));SWEET_PUZZLES.forEach((p,i)=>menu.add(new Option('Medium '+(i+1)+' · '+p.name,i,i===index,i===index)));menu.onchange=()=>location.href='sweets-review.html'+(menu.value<0?'':'?puzzle='+menu.value);
let g=new Game(20),running=false,selected='walk',revision=-1,last=0,acc=0;const audio=new ImpactAudio();if(LEVELS[20].spawnY>500)document.querySelector('#stage').scrollTop=canvas.height;function skills(){const tray=document.querySelector('#skills');tray.replaceChildren();for(const key of ['walk',...Object.keys(g.stock)]){const b=document.createElement('button');b.textContent=SKILLS[key].name+' '+(key==='walk'?'∞':g.stock[key]);b.classList.toggle('active',key===selected);b.onclick=()=>{selected=key;skills();};tray.append(b);}}skills();document.querySelector('#tip').onclick=()=>document.querySelector('#hint').hidden=!document.querySelector('#hint').hidden;
document.querySelector('#play').onclick=()=>{audio.unlock();running=!running;document.querySelector('#play').textContent=running?'Pause':'Play level';};document.querySelector('#restart').onclick=()=>{g=new Game(20);running=false;revision=-1;document.querySelector('#status').textContent='20 lemmings · rescue 18';skills();document.querySelector('#play').textContent='Play level';};canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*g.height/r.height;const u=g.units.filter(u=>!['exit','lost','saved'].includes(u.state)).sort((a,b)=>Math.hypot(a.x-x,a.y-10-y)-Math.hypot(b.x-x,b.y-10-y))[0];if(u&&Math.hypot(u.x-x,u.y-10-y)<25){const result=g.assign(u.id,selected);if(!result.ok)document.querySelector('#status').textContent=result.message;skills();}};
function frame(t){const dt=Math.min(100,t-last);last=t;if(running&&!g.result){acc+=dt;while(acc>=1000/60){g.step();acc-=1000/60;}}else acc=0;c.fillStyle='#30263f';c.fillRect(0,0,1000,g.height);c.fillStyle='#3b2d46';c.fillRect(0,g.height-28,1000,28);if(revision!==g.revision){candyTerrain(g,terrain,art);revision=g.revision;}c.drawImage(terrain,0,0);drawObjects(c,g);magicalEntrance(c,g.tick,{...g.level,spawnY:90},g.spawned,g.lastSpawnTick);exitArch(c,g.level.exitX,g.level.exitY,g.tick);exitPortal(c,g.level,g.tick,g.units.some(u=>u.state==='exit'));drawSplats(c,g.effects,g.tick);audio.consume([...g.effects,...g.soundEvents],.5,false);for(const u of g.units){if(u.state==='exit')enteringLemming(c,u,g.level,g.tick);else{character(c,u.x,u.y,u.state,u.dir,g.tick);skillEquipment(c,u,g.tick);}}if(running)document.querySelector('#status').textContent=`${g.saved} saved · ${g.lost} lost · ${g.result||'rescue 18'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
