<!doctype html><html lang="en"><meta charset="utf-8"><title>Oversized sweet adventures</title><style>body{background:#251e32;color:#f7ebdf;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:#30263f;border-radius:12px;overflow:hidden}canvas{width:100%;display:block}h2,p{margin:16px}a{color:#f0d481}small{color:#b9c9ab}</style><h1>Pick ’n’ Mix · Oversized sweet adventures</h1><p>Five bonus medium adventures · <a href="sweet-range-review.html">Sweet range</a></p><main></main><script type="module">
import {prepareSweetPuzzle,SWEET_PUZZLES} from './src/sweet-puzzles.js';import {drawObjects} from './src/object-art.js';import {LEVELS} from './src/levels.js';import {Game} from './src/engine.js';import {exitArch,magicalEntrance} from './src/art.js';
for(let i=0;i<5;i++){const article=document.createElement('article'),canvas=document.createElement('canvas'),art=document.createElement('canvas');canvas.width=1000;canvas.height=850;const level=prepareSweetPuzzle(i,art);LEVELS[20]=level;const g=new Game(20);const cover=Math.round(g.terrain.reduce((n,v)=>n+(v?1:0),0)/g.terrain.length*100);let valid=g.at(level.spawnX,level.spawnY+4)&&Array.from({length:73},(_,j)=>g.at(level.exitX-35+j,level.exitY)).every(Boolean);const scout=g.spawn();for(let tick=0;tick<100;tick++)g.step();valid=valid&&g.lost===0;const c=canvas.getContext('2d');c.drawImage(art,0,0);drawObjects(c,g);magicalEntrance(c,0,{...level,spawnY:90},0);exitArch(c,level.exitX,level.exitY,0);article.innerHTML=`<h2><a href="sweets-review.html?puzzle=${i}">${i+1}. ${level.name}</a></h2><p>${SWEET_PUZZLES[i].idea}</p><p><small>${valid?'Entrance, exit and arrival checks passed':'CHECK FAILED'} · ${cover}% solid terrain · 850px deep</small></p>`;article.append(canvas);document.querySelector('main').append(article);}
</script></html>
