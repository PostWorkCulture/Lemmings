<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemmings · Level practice</title><link rel="icon" href="assets/game-icon.svg"><style>
*{box-sizing:border-box}body{background:#101019;color:#f5f2ec;font:14px system-ui;margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{flex-shrink:0;background:#090a0b;border-bottom:1px solid #33313b;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}a{color:#ead0a0;text-decoration:none}select{min-width:180px;max-width:360px;flex:1}button,select{font:inherit;padding:9px 12px;background:#202026;color:#fff;border:1px solid #45434b;border-radius:7px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#51413b;border-color:#d5b985}button:disabled{opacity:.4;cursor:default}.controls{display:flex;gap:6px}.controls button{min-width:45px;height:43px;font-size:20px}#status{margin-left:auto;font-size:13px;font-weight:700;display:flex;gap:18px}.alert{color:#ff6c65}#skills{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 14px;background:#111113;overflow-x:auto;border-bottom:1px solid #343139}#skills button{white-space:nowrap;font-weight:700}#skills b{color:#ead0a0;margin-left:7px}.practice{font-size:10px;letter-spacing:.14em;color:#bdb4c2}#viewport{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}canvas{width:100%;height:auto;display:block;image-rendering:auto}#viewport.fit{overflow:hidden}#viewport.fit canvas{height:100%;object-fit:fill}#message{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#19171eef;border:1px solid #685b65;padding:10px 18px;border-radius:9px;pointer-events:none}#message:empty{display:none}dialog{background:#19171e;color:#eee;border:1px solid #605263;border-radius:12px;max-width:440px}dialog::backdrop{background:#0007}dialog p{line-height:1.7}#result{max-width:390px;text-align:center}#result h2{font-size:28px}.small{font-size:12px;color:#c6bacb}#title{max-width:120px}@media(max-width:700px){header{gap:6px;padding:8px}#status{width:100%;justify-content:space-between}#title{display:none}}
@media(max-width:700px) and (orientation:portrait){#viewport.fit{display:flex;align-items:center}#viewport.fit canvas{height:auto;max-height:100%;flex-shrink:0}}
</style></head><body><header><a id="title" href="original-worlds.html">LEMMINGS<br><span class="practice">PRACTICE · NO SAVE CHANGES</span></a><select id="level" aria-label="Choose practice level"></select><div class="controls"><button id="play" aria-label="Play level" title="Play or pause (Space)">▶</button><button id="speed" aria-label="Speed: normal" title="Toggle 3× speed">1×</button><button id="restart" aria-label="Restart level" title="Restart">↻</button></div><button id="fit" aria-pressed="true">Full map</button><button id="tip">Tip</button><button id="sound" aria-pressed="true" aria-label="Toggle music">♫</button><div id="status"><span>HOME <b id="saved">0</b></span><span>LOST <b id="lost">0</b></span><span id="time">0:00</span></div></header><div id="skills" aria-label="Available skills"></div><div id="viewport" class="fit"><canvas id="game" width="1000" height="470" tabindex="0" aria-label="Playable terrain. Choose a skill, then click a lemming."></canvas></div><div id="message" role="status"></div><dialog id="tips"><h2 id="tip-title"></h2><p id="tip-text"></p><button id="close-tip">Close</button></dialog><dialog id="result"><h2 id="result-title"></h2><p id="result-copy"></p><p class="small">Practice does not change your campaign progress.</p><button id="again">Try again</button><a href="./">Play the campaign →</a></dialog><audio id="music" loop></audio><script type="module" src="src/world-playtest.js"></script></body></html>
