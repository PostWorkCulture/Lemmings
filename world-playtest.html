<!doctype html><html><head><meta charset="utf-8"><title>World playtest</title><style>body{background:#182824;color:#e4e8d8;font:14px system-ui;margin:15px}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}button,select{padding:8px;margin:4px;background:#344b40;color:#e4e8d8;border:1px solid #788c6a;border-radius:5px}p{margin:5px}</style></head><body><select id="level"></select><button id="play">Play / pause</button><button id="restart">Restart</button><div id="skills"></div><div id="viewport" style="height:70vh;overflow-y:auto;overscroll-behavior:contain"><canvas id="game" width="1000" height="470"></canvas></div><p id="status"></p><script type="module">
import {drawDrowning,drawSplats} from "./src/impact-effects.js";
import {ambientWorld,finaleLandmarks} from './src/ambient-art.js';import {LEVELS} from './src/levels.js';import {Game} from './src/engine.js';import {SKILLS} from './src/skills.js';import {character,makeBackground,renderTerrain,scenery,hazards,enteringLemming,exitPortal} from './src/art.js';import {drawObjects,skillEquipment} from './src/object-art.js';
const select=document.querySelector('#level'),canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),terrain=document.createElement('canvas');terrain.width=1000;terrain.height=470;
for(const l of LEVELS){const option=document.createElement('option');option.value=l.id;option.textContent=(l.id+1)+'. '+l.difficulty+' / '+l.world+' / '+l.name;select.append(option);}let g,bg,revision=-1,running=false,skill='walk',last=0;
function reset(){g=new Game(Number(select.value));canvas.height=g.height;terrain.height=g.height;document.querySelector('#viewport').scrollTop=0;bg=makeBackground(g.level.theme,g.height,g.level);revision=-1;running=false;const tray=document.querySelector('#skills');tray.replaceChildren();for(const k of Object.keys(SKILLS)){if(k!=='walk'&&!g.stock[k])continue;const b=document.createElement('button');b.textContent=SKILLS[k].name;b.onclick=()=>{skill=k;};tray.append(b);}}const requested=Number(new URLSearchParams(location.search).get('level'));if(Number.isInteger(requested)&&LEVELS[requested])select.value=String(requested);reset();select.onchange=reset;document.querySelector('#restart').onclick=reset;document.querySelector('#play').onclick=()=>running=!running;
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/1000,r.height/g.height),x=(e.clientX-r.left-(r.width-1000*scale)/2)/scale,y=(e.clientY-r.top-(r.height-g.height*scale)/2)/scale,u=g.units.find(u=>Math.hypot(u.x-x,u.y-12-y)<20);if(u)g.assign(u.id,skill);};
function frame(t){if(running&&t-last>16){g.step();last=t;}c.drawImage(bg,0,0);hazards(c,t*.06,g.level.theme,g.height);ambientWorld(c,t*.06,g.level);finaleLandmarks(c,t*.06,g.level);if(revision!==g.revision){renderTerrain(g,terrain);revision=g.revision;}c.drawImage(terrain,0,0);drawObjects(c,g);scenery(c,g.tick,g.level,g.spawned,g.lastSpawnTick,t*.06,g);exitPortal(c,g.level,g.tick,g.units.some(u=>u.state==='exit'));drawSplats(c,g.effects,g.tick);for(const u of g.units){if(u.state==='drown')drawDrowning(c,u,g.tick,character,g.height);else if(u.state==='exit')enteringLemming(c,u,g.level,g.tick);else{character(c,u.x,u.y,u.state,u.dir,g.tick);skillEquipment(c,u,g.tick);}}document.querySelector('#status').textContent=`${g.spawned} released / ${g.saved} saved / ${g.lost} lost / ${g.result||'in progress'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
