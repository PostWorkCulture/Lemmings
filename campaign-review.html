<!doctype html><html><head><meta charset="utf-8"><title>Campaign review</title><style>body{background:#162321;color:#e1e5d8;font:14px system-ui}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}canvas{width:100%;image-rendering:pixelated}h2{font-size:14px;margin:8px}p{margin:8px;font-size:12px}</style></head><body><h1>20 level campaign</h1><main></main><script type="module">import {ambientWorld,finaleLandmarks} from './src/ambient-art.js';import {drawObjects} from './src/object-art.js';import {LEVELS} from './src/levels.js';import {Game} from './src/engine.js';import {makeBackground,renderTerrain,scenery,hazards} from './src/art.js';for(const l of (new URLSearchParams(location.search).has('extreme')?LEVELS.slice(15):LEVELS)){const el=document.createElement('section');el.innerHTML=`<h2>${l.id+1}. ${l.difficulty}: ${l.name}</h2><canvas width="1000" height="${l.height}"></canvas><p>Save ${l.target}/20 | Block ${l.stock.block} | Build ${l.stock.build} | Dig ${l.stock.dig}</p>`;document.querySelector('main').append(el);const c=el.querySelector('canvas').getContext('2d');c.drawImage(makeBackground(l.theme,l.height),0,0);hazards(c,90,l.theme,l.height);ambientWorld(c,180,l);finaleLandmarks(c,180,l);const t=document.createElement('canvas');t.width=1000;t.height=l.height;renderTerrain(new Game(l.id),t);c.drawImage(t,0,0);drawObjects(c,new Game(l.id));scenery(c,0,l);}</script></body></html>
