<!doctype html><html><head><meta charset="utf-8"><title>Entrance review</title><style>body{background:#172b29;color:#ddd;font:16px sans-serif;text-align:center}canvas{width:280px;height:360px;border:1px solid #567;image-rendering:pixelated}main{display:flex;justify-content:center;gap:20px}</style></head><body><h1>Rocket entrance</h1><main></main><script type="module">import{magicalEntrance}from './src/art.js';import{LEVELS}from './src/levels.js';for(const [label,tick,count,last]of [['Before release',0,0,null],['Releasing',500,5,440],['After last drop',2200,20,2090]]){const section=document.createElement('section');section.innerHTML=`<h2>${label}</h2><canvas width="280" height="360"></canvas>`;document.querySelector('main').append(section);const c=section.querySelector('canvas').getContext('2d');c.translate(140,310);c.scale(3,3);magicalEntrance(c,tick,{...LEVELS[0],spawnX:0,spawnY:0},count,last);}</script></body></html>
