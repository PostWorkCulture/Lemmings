<!doctype html><html><head><title>Hazard animation review</title><style>body{background:#14242c;color:#e8eee4;font:18px system-ui;padding:30px}canvas{width:100%;height:180px;image-rendering:pixelated;border:1px solid #526570}h2{font-size:18px}</style></head><body><h1>Hazard animation review</h1><h2>Moving water</h2><canvas id="water" width="1000" height="60"></canvas><h2>Bubbling lava</h2><canvas id="lava" width="1000" height="60"></canvas><script type="module">import {hazards} from './src/art.js';function frame(t){for(const [id,theme] of [['water','forest'],['lava','clockwork']]){const c=document.getElementById(id).getContext('2d');c.clearRect(0,0,1000,60);c.save();c.translate(0,-410);hazards(c,t*.06,theme);c.restore();}requestAnimationFrame(frame);}requestAnimationFrame(frame);</script></body></html>
