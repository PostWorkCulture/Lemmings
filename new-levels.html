<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>50 Lemmings adventures</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#14241d;color:#eeeede;font:16px system-ui}header{max-width:1400px;margin:auto}h1{font-size:28px;margin:12px 0}p{line-height:1.6;color:#c1d0c5}a{color:#e5eabe}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}nav a{border:1px solid #577060;padding:10px 14px;border-radius:8px;text-decoration:none}nav [aria-current]{background:#3d5948}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1400px;margin:auto}article{min-width:0}h2{font-size:19px}canvas{width:100%;border-radius:10px}small{color:#c2d2bf}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{grid-template-columns:1fr}body{padding:14px}}</style>
<header><a href="./">← Play Lemmings</a><h1>50 adventures</h1><p>Five worlds, ten adventures each. Forest · Easy. Dunes and Mountains · Medium. Sweets · Hard. Lava Land · Extreme.</p><nav aria-label="Campaign chapters"></nav></header><main></main>
<script type="module">
import {LEVELS,CAMPAIGN,CHAPTERS} from './src/levels.js';import {Game} from './src/engine.js';import {makeBackground,renderTerrain,scenery,hazards} from './src/art.js';import {drawObjects} from './src/object-art.js';import {ambientWorld,finaleLandmarks} from './src/ambient-art.js';
const requested=Number(new URLSearchParams(location.search).get('chapter')),chapter=Number.isInteger(requested)&&requested>=0&&requested<5?requested:0;
for(let i=0;i<5;i++){const a=document.createElement('a');a.href='?chapter='+i;a.textContent=CHAPTERS[i].name;if(i===chapter)a.setAttribute('aria-current','page');document.querySelector('nav').append(a);}
const scenes=[];for(const level of CAMPAIGN.slice(chapter*10,chapter*10+10)){const id=level.id;
 const g=new Game(id),l=g.level,article=document.createElement('article');article.innerHTML=`<h2>${l.campaignIndex+1}. ${l.name}</h2><p>${l.hints[0]}</p><small>${l.difficulty} · Rescue ${l.target}/${l.total} · ★★★ under ${Math.floor(l.targetTime/60)}:${String(l.targetTime%60).padStart(2,'0')}</small><canvas width="1000" height="${l.height}" aria-label="Map of ${l.name}"></canvas>`;document.querySelector('main').append(article);
 const c=article.querySelector('canvas').getContext('2d'),terrain=document.createElement('canvas');terrain.width=1000;terrain.height=l.height;renderTerrain(g,terrain);scenes.push({g,l,c,terrain,bg:makeBackground(l.theme,l.height,l)});
}
function frame(ms){for(const {g,l,c,terrain,bg} of scenes){g.tick=ms*.06;c.drawImage(bg,0,0);hazards(c,g.tick,l.theme,l.height);ambientWorld(c,g.tick,l);finaleLandmarks(c,g.tick,l);c.drawImage(terrain,0,0);drawObjects(c,g);scenery(c,g.tick,l,0,null,g.tick,g);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
