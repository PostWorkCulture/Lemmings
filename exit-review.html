<!doctype html><html><head><meta charset="utf-8"><title>Exit animation review</title><style>body{background:#14231e;color:#e9eddc;font:15px sans-serif;text-align:center}canvas{width:800px;max-width:95vw;border:1px solid #607254;image-rendering:pixelated}button{background:#34482d;color:#eee;border:1px solid #839961;border-radius:4px;padding:10px;margin:5px}h1{font-size:20px}</style></head><body><h1>Exit arrival · actual game renderer</h1><canvas width="800" height="300"></canvas><p id="state"></p><button id="play">Play arrival</button><button data-frame="1">Approach</button><button data-frame="24">Turn inside</button><button data-frame="52">Portal spin</button><button data-frame="80">Shrink away</button><button data-frame="97">Rescued</button><script type="module">import{Game}from './src/engine.js';import{makeBackground,renderTerrain,scenery,character,exitPortal,enteringLemming}from './src/art.js';const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),bg=makeBackground(),terrain=document.createElement('canvas');terrain.width=1000;terrain.height=470;let game,playing=false,last=0,acc=0;function reset(){game=new Game();game.spawned=20;game.saved=19;game.units=[{id:0,x:890,y:366,dir:1,state:'walk',vy:0,jobTick:0,steps:0}];renderTerrain(game,terrain);}function draw(){c.clearRect(0,0,800,300);c.save();c.translate(400,245);c.scale(3,3);c.translate(-900,-366);c.imageSmoothingEnabled=false;c.drawImage(bg,0,0);c.drawImage(terrain,0,0);scenery(c,game.tick,game.level);exitPortal(c,game.level,game.tick,game.units.some(u=>u.state==='exit'));for(const u of game.units)u.state==='exit'?enteringLemming(c,u,game.level,game.tick):character(c,u.x,u.y,u.state,u.dir,game.tick);c.restore();document.querySelector('#state').textContent=`Frame ${game.tick} · Home ${game.saved}/20 · ${game.result||game.units[0]?.state}`;}document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{playing=false;reset();for(let i=0;i<Number(b.dataset.frame);i++)game.step();draw();});document.querySelector('#play').onclick=()=>{reset();playing=true;acc=0;};function frame(t){const dt=Math.min(100,t-last);last=t;if(playing){acc+=dt;while(acc>1000/60){game.step();acc-=1000/60;}if(game.result)playing=false;}draw();requestAnimationFrame(frame);}reset();requestAnimationFrame(frame);</script></body></html>
