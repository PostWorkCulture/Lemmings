<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The sweet shop · full concept range</title><style>*{box-sizing:border-box}body{margin:0;background:#261f32;color:#f8eedf;font:14px system-ui}header{padding:28px 32px}h1{margin:8px 0}p{color:#beaec9;line-height:1.6}a{color:#f2d992}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:24px 32px}article{background:#30263e;border:1px solid #57435f;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:auto}section{padding:0 20px 20px}h2{font-size:18px}.type{color:#d8c6dc}.role{color:#b5c3ac}footer{padding:28px}@media(max-width:650px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><header><small>TERRAIN COLLECTION · 17 DESIGNS & COLOUR VARIANTS</small><h1>The Pick ’n’ Mix Collection</h1><p>A few oversized sweets per level. Quiet backgrounds and real, editable sweet-shaped terrain.</p><a href="sweets-review.html?puzzle=0">Play the five new medium levels →</a> · <a href="sweet-level-review.html">See all five maps →</a></header><main></main><footer>Concept artwork and playable previews. </footer><script type="module">import {SWEET_RANGE,drawRangeSweet} from './src/sweet-range.js';for(const [i,[name,type,role]]of SWEET_RANGE.entries()){const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=720;canvas.height=400;canvas.setAttribute('aria-label',name+' sweet concept');const c=canvas.getContext('2d');c.scale(2,2);drawRangeSweet(c,i);const section=document.createElement('section'),heading=document.createElement('h2'),detail=document.createElement('p'),use=document.createElement('p');heading.textContent=name;detail.textContent=type;detail.className='type';use.textContent=role;use.className='role';section.append(heading,detail,use);card.append(canvas,section);document.querySelector('main').append(card);}</script></html>
