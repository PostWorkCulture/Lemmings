<!doctype html><html><head><meta charset="utf-8"><title>Impact effect review</title><style>body{background:#142b2b;color:#dce8d3;font:16px system-ui;margin:24px}button{padding:12px;margin:8px;background:#b4cb79;border:0;border-radius:6px}canvas{width:100%;max-width:1000px;display:block;image-rendering:pixelated}</style></head><body><h1>Fatal fall effect</h1><button id="fatal">Fatal fall</button><button id="safe">Safe fall</button><button id="parachute">Parachute fall</button><p id="status">Choose a landing test. Fatal impacts hold briefly for inspection.</p><canvas width="1000" height="470"></canvas><script type="module">
import {Game} from './src/engine.js';import {character} from './src/art.js';import {drawSplats,ImpactAudio} from './src/impact-effects.js';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),sound=new ImpactAudio();let g=null,hold=false,last=0;
function drop(start,float=false){sound.unlock();g=new Game();g.terrain.fill(0);g.rect(50,320,900,30,1);g.units=[];g.spawned=0;const u=g.spawn();Object.assign(u,{x:500,y:start,fallStart:start,abilities:{float},state:'fall',dir:1});g.spawned=20;for(let i=0;i<500&&g.units[0]?.state==='fall';i++)g.step();for(let i=0;i<12;i++)g.step();hold=true;}
document.querySelector('#fatal').onclick=()=>drop(70);document.querySelector('#safe').onclick=()=>drop(245);document.querySelector('#parachute').onclick=()=>drop(70,true);
function frame(t){if(g&&!hold&&t-last>=16){g.step();last=t;if(g.effects.length&&g.tick-g.effects[0].tick>=12)hold=true;}c.fillStyle='#183333';c.fillRect(0,0,1000,470);c.fillStyle='#6b8260';c.fillRect(50,320,900,30);c.fillStyle='#bad37e';c.fillRect(50,320,900,3);if(g){for(const u of g.units)character(c,u.x,u.y,u.state,u.dir,g.tick);drawSplats(c,g.effects,g.tick);sound.consume(g.effects,.55,false);document.querySelector('#status').textContent=`Lost: ${g.lost} · Impact effects: ${g.effects.length}`;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
