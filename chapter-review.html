<!doctype html><meta charset="utf-8"><title>Level quality review — local preview</title><style>body{margin:18px;background:#14241d;color:#eeeede;font:14px sans-serif}h1{font-size:22px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}h2{font-size:18px;margin:6px 0}p{color:#bfcdb7;margin:6px 0}canvas{width:100%;background:#162521;image-rendering:pixelated;border-radius:7px}body.chapter main{grid-template-columns:repeat(3,1fr)}body.chapter p{font-size:12px}body.single main{display:block;max-width:1100px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}a{color:#dcebc5;text-decoration:none}nav a{padding:9px 14px;background:#294236;border:1px solid #45644d;border-radius:8px}nav a[aria-current=page]{background:#496249;color:white}section{min-width:0}section h2 a:hover{text-decoration:underline}@media(max-width:850px){main,body.chapter main{grid-template-columns:1fr}} </style><h1>Level quality review · unpublished</h1><nav aria-label="Review chapters"></nav><main></main><script type="module">
import {LEVELS,CHAPTERS} from './src/levels.js';import {Game} from './src/engine.js';import {makeBackground,renderTerrain,scenery,hazards} from './src/art.js';import {drawObjects} from './src/object-art.js';import {ambientWorld,finaleLandmarks} from './src/ambient-art.js';
if(new URLSearchParams(location.search).has('chapter'))document.body.classList.add('chapter');
const params=new URLSearchParams(location.search);if(params.has('level'))document.body.classList.add('single');
const nav=document.querySelector('nav');for(const [i,label] of ['All levels',...CHAPTERS.map(c=>c.name)].entries()){const a=document.createElement('a');a.textContent=label;a.href=i?'?chapter='+(i-1):'?all';if((i&&params.get('chapter')===String(i-1))||(!i&&params.has('all')))a.setAttribute('aria-current','page');nav.append(a);}
const scenes=[];
for(const [i,index]of (new URLSearchParams(location.search).has('chapter')?LEVELS.map((_,i)=>i).filter(i=>Math.floor(i/5)===Number(new URLSearchParams(location.search).get('chapter'))):new URLSearchParams(location.search).has('level')?[Number(new URLSearchParams(location.search).get('level'))]:new URLSearchParams(location.search).has('all')?LEVELS.map((_,i)=>i):[0,6,12,15]).entries()){const l=LEVELS[index],g=new Game(index),section=document.createElement('section');section.innerHTML='<h2><a href="?level='+index+'">'+(index+1)+'. '+l.name+'</a></h2><p>'+l.chapter+' · Levels '+(Math.floor(index/5)*5+1)+'–'+(Math.floor(index/5)*5+5)+' · '+l.difficulty+' · '+(index+1)+'. '+l.name+' · <a href="world-playtest.html?level='+index+'">Try this level</a></p><canvas width="1000" height="'+l.height+'"></canvas>';document.querySelector('main').append(section);const c=section.querySelector('canvas').getContext('2d'),background=makeBackground(l.theme,l.height,l),terrain=document.createElement('canvas');terrain.width=1000;terrain.height=l.height;renderTerrain(g,terrain);scenes.push({l,g,c,background,terrain});}
function animate(ms){const tick=ms*.06;for(const {l,g,c,background,terrain} of scenes){c.clearRect(0,0,1000,l.height);c.drawImage(background,0,0);hazards(c,tick,l.theme,l.height);ambientWorld(c,tick,l);finaleLandmarks(c,tick,l);c.drawImage(terrain,0,0);g.tick=tick;drawObjects(c,g);scenery(c,tick,l);}requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script>
