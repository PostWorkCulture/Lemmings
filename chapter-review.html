<!doctype html><meta charset="utf-8"><title>Four themed worlds — local preview</title><style>body{margin:18px;background:#14241d;color:#eeeede;font:14px sans-serif}h1{font-size:22px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}h2{font-size:18px;margin:6px 0}p{color:#bfcdb7;margin:6px 0}canvas{width:100%;background:#162521;image-rendering:pixelated;border-radius:7px}body.chapter main{grid-template-columns:repeat(3,1fr)}body.chapter p{font-size:12px}</style><h1>Four worlds · unpublished preview</h1><main></main><script type="module">
import {LEVELS,CHAPTERS} from './src/levels.js';import {Game} from './src/engine.js';import {makeBackground,renderTerrain,scenery,hazards} from './src/art.js';import {drawObjects} from './src/object-art.js';import {ambientWorld,finaleLandmarks} from './src/ambient-art.js';
if(new URLSearchParams(location.search).has('chapter'))document.body.classList.add('chapter');
const scenes=[];
for(const [i,index]of (new URLSearchParams(location.search).has('chapter')?LEVELS.map((_,i)=>i).filter(i=>Math.floor(i/5)===Number(new URLSearchParams(location.search).get('chapter'))):new URLSearchParams(location.search).has('level')?[Number(new URLSearchParams(location.search).get('level'))]:new URLSearchParams(location.search).has('all')?LEVELS.map((_,i)=>i):[0,6,12,15]).entries()){const l=LEVELS[index],g=new Game(index),section=document.createElement('section');section.innerHTML='<h2>'+CHAPTERS[Math.floor(index/5)].name+'</h2><p>Levels '+(Math.floor(index/5)*5+1)+'–'+(Math.floor(index/5)*5+5)+' · '+l.difficulty+' · '+(index+1)+'. '+l.name+'</p><canvas width="1000" height="'+l.height+'"></canvas>';document.querySelector('main').append(section);const c=section.querySelector('canvas').getContext('2d'),background=makeBackground(l.theme,l.height),terrain=document.createElement('canvas');terrain.width=1000;terrain.height=l.height;renderTerrain(g,terrain);scenes.push({l,g,c,background,terrain});}
function animate(ms){const tick=ms*.06;for(const {l,g,c,background,terrain} of scenes){c.clearRect(0,0,1000,l.height);c.drawImage(background,0,0);hazards(c,tick,l.theme,l.height);ambientWorld(c,tick,l);finaleLandmarks(c,tick,l);c.drawImage(terrain,0,0);g.tick=tick;drawObjects(c,g);scenery(c,tick,l);}requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script>
