<!doctype html><meta charset="utf-8"><title>Terrain rendering checks</title>
<style>body{background:#141a18;color:#dcf4df;font:16px system-ui;padding:24px}li{margin:12px}</style>
<h1>Terrain rendering checks</h1><p id="result">Running...</p><ol id="checks"></ol>
<script type="module">
import {Game} from '../src/engine.js';import {CAMPAIGN} from '../src/levels.js';import {renderTerrain,makeBackground} from '../src/art.js';
const make=height=>{const c=document.createElement('canvas');c.width=1000;c.height=height;return c;};let failed=0,checks=0;
const check=(label,ok)=>{checks++;const li=document.createElement('li');li.textContent=(ok?'PASS: ':'FAIL: ')+label;document.querySelector('ol').append(li);if(!ok)failed++;};
const pixels=c=>c.getContext('2d').getImageData(0,0,c.width,c.height).data;
// Prime every image sheet, then wait for the real assets before comparing caches.
for(const l of CAMPAIGN){new Game(l.id);makeBackground(l.theme,l.height,l);}
await new Promise(r=>setTimeout(r,1500));
for(const l of CAMPAIGN){
 const a=new Game(l.id),b=new Game(l.id),ca=make(a.height),cb=make(b.height),mask=a.terrain.slice();
 renderTerrain(a,ca);const first=pixels(ca);renderTerrain(a,ca);const second=pixels(ca);
 check(`${l.campaignIndex+1}. ${l.name}: repaint is stable and preserves collision`,first.every((v,i)=>v===second[i])&&mask.every((v,i)=>v===a.terrain[i]));
 for(const [x,y,w,h,type]of [[200,300,48,45,0],[340,340,42,8,3],[600,400,52,44,0],[0,0,7,80,0],[990,0,10,40,0]]){a.rect(x,y,w,h,type);b.rect(x,y,w,h,type);renderTerrain(a,ca);}
 renderTerrain(b,cb);const pa=pixels(ca),pb=pixels(cb);check(`${l.campaignIndex+1}. ${l.name}: excavation matches a fresh render`,pa.every((v,i)=>v===pb[i]));await new Promise(r=>setTimeout(r,0));
}
const a=new Game(0),ca=make(a.height);renderTerrain(a,ca);a.reset(14);ca.height=a.height;renderTerrain(a,ca);const b=new Game(14),cb=make(b.height);renderTerrain(b,cb);const pa=pixels(ca),pb=pixels(cb);check('Switching worlds discards previous painted terrain',pa.every((v,i)=>v===pb[i]));
const g=new Game(0),c=make(g.height);g.terrain.fill(1);renderTerrain(g,c);const pc=pixels(c);let green=0;for(let y=0;y<30;y++)for(let x=200;x<800;x++){const i=(y*1000+x)*4;if(pc[i+1]>pc[i]*1.05&&pc[i+1]>pc[i+2]*1.5)green++;}check('No phantom green stripes on the ceiling',green===0);
const fresh=new Game(0);fresh.terrain.fill(0);fresh.rect(100,100,300,40,2);fresh.rect(100,140,300,100,1);const fc=make(fresh.height);renderTerrain(fresh,fc);const fp=pixels(fc);green=0;for(let y=140;y<155;y++)for(let x=120;x<380;x++){const i=(y*1000+x)*4;if(fp[i+1]>fp[i]*1.05&&fp[i+1]>fp[i+2]*1.5)green++;}check('No grass strip beneath hard blocks',green===0);
document.querySelector('#result').textContent=failed?`${failed} of ${checks} checks failed`:`All ${checks} rendering checks passed`;document.body.dataset.complete='true';document.body.dataset.failed=failed;
</script>
