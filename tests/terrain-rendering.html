<!doctype html><meta charset="utf-8"><title>Terrain rendering checks</title><style>body{background:#141a18;color:#dcf4df;font:16px system-ui;padding:24px}li{margin:12px}canvas{width:200px}</style><h1>Terrain rendering checks</h1><p id="result">Running…</p><ol id="checks"></ol><script type="module">
import {Game} from '../src/engine.js';import {renderTerrain} from '../src/art.js';
const make=height=>{const c=document.createElement('canvas');c.width=1000;c.height=height;return c;};let failed=0;
const check=(label,ok)=>{const li=document.createElement('li');li.textContent=(ok?'PASS: ':'FAIL: ')+label;document.querySelector('ol').append(li);if(!ok)failed++;};
for(const id of [0,6,14,45,36]){const a=new Game(id),b=new Game(id),ca=make(a.height),cb=make(b.height);renderTerrain(a,ca);for(const [x,y,w,h,type]of [[200,300,48,45,0],[340,340,42,8,3],[600,400,52,44,0]]){a.rect(x,y,w,h,type);b.rect(x,y,w,h,type);renderTerrain(a,ca);}renderTerrain(b,cb);const pa=ca.getContext('2d').getImageData(0,0,1000,a.height).data,pb=cb.getContext('2d').getImageData(0,0,1000,b.height).data;check(a.level.chapter+' cached excavation matches a fresh render',pa.every((v,i)=>v===pb[i]));await new Promise(r=>setTimeout(r,0));}
const a=new Game(0),ca=make(a.height);renderTerrain(a,ca);a.reset(14);ca.height=a.height;renderTerrain(a,ca);const b=new Game(14),cb=make(b.height);renderTerrain(b,cb);const pa=ca.getContext('2d').getImageData(0,0,1000,a.height).data,pb=cb.getContext('2d').getImageData(0,0,1000,b.height).data;check('Switching worlds discards the previous painted terrain',pa.every((v,i)=>v===pb[i]));document.querySelector('#result').textContent=failed?failed+' checks failed':'All 6 rendering checks passed';
</script>
